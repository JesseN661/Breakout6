<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightFlow - Employee Performance Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Breakout 6 Dashboard</h1>
            <p>Employee Performance Metrics Tracking</p>
        </header>

        <section class="controls">
            <div class="search-filters">
                <input type="text" id="search-bar" placeholder="Search by name...">
                <select id="role-filter">
                    <option value="">All Roles</option>
                    <option value="Developer">Developer</option>
                    <option value="Designer">Designer</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="QA Engineer">QA Engineer</option>
                </select>
            </div>
            <button id="add-employee-btn" class="btn btn-primary">Add Employee</button>
        </section>

        <section id="table-container" class="table-container"></section>

        <section id="summary-container" class="summary-card"></section>
    </div>

    <div id="modal-root"></div>
    <script src="app.js"></script>
</body>
</html>
